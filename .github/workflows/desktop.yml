name: 桌面端打包

# 为什么要有这个文件：
# Tauri 不能从 macOS 交叉编译到 Windows（安装包由 Windows 上的 WiX / NSIS 生成，
# 依赖 MSVC 工具链）。所以 .exe 只能在 Windows 上打——要么用这个工作流，
# 要么在一台装了工具链的 Windows 电脑上跑 `npm run desktop:build:win`。
#
# 用法：推到 GitHub 后，在 Actions 页面点 "Run workflow"；
# 或者打一个 v* 标签自动触发。产物在 run 页面的 Artifacts 里下载。
#
# 两个注意点：
# 1. macOS 这边**不用** `npm run desktop:build`（即 `tauri build --bundles app,dmg`）。
#    它调用的 Tauri 内置 bundle_dmg.sh 在新版 macOS 上会因为一个没转义的正则失败
#    （详见 scripts/package-dmg.sh 顶部注释），而且失败时会在 /Volumes 留下挂载残留。
#    这里改用 scripts/package-dmg.sh：只让 tauri 出 .app，dmg 自己拼。
# 2. macOS 出的是 **universal 双架构**包（Intel + Apple Silicon），需要额外装
#    x86_64-apple-darwin 目标；脚本会自己前置检查。

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  bundle:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            label: macOS (universal)
            setup: rustup target add x86_64-apple-darwin
            build: bash scripts/package-dmg.sh --target universal-apple-darwin
            artifacts: dist-desktop/*.dmg
          - os: windows-latest
            label: Windows (x64)
            setup: ""
            # 覆盖配置里的 ["app","dmg"]（那是 macOS 专用目标）；
            # nsis 产出的是 setup.exe，符合"装个 exe"的习惯。
            build: npx tauri build --bundles nsis
            artifacts: src-tauri/target/release/bundle/nsis/*.exe

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装依赖
        run: npm ci

      - name: 追加 Rust 目标
        if: matrix.setup != ''
        run: ${{ matrix.setup }}

      - name: 打包
        run: ${{ matrix.build }}

      - name: 收集产物
        uses: actions/upload-artifact@v4
        with:
          name: 班主任AI工作台-${{ matrix.label }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
